name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach the Lambda zips to the release
  packages: write # push images to GitHub Container Registry

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build zips
        run: |
          make lambda ARCH=arm64 && mv build/alert-handler.zip alert-handler-arm64.zip
          make lambda ARCH=amd64 && mv build/alert-handler.zip alert-handler-x86_64.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: alert-handler-*.zip
