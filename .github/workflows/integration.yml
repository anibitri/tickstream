name: integration

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testcontainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Integration tests (real Kafka and LocalStack)
        env:
          # TODO(you): add a LOCALSTACK_AUTH_TOKEN repository secret.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: go test -tags integration -count=1 -timeout 15m ./internal/kafkax/ ./internal/storage/
