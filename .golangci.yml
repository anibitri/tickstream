version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (*github.com/coder/websocket.Conn).CloseNow # best-effort cleanup
  exclusions:
    presets:
      - std-error-handling # e.g. unchecked errors from deferred Close()
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anibitri/tickstream
