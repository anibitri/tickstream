# The whole system on one machine. Start it with `make up` from the repo root.
#
#   Dashboard + API  http://localhost:8080     Grafana     http://localhost:3000
#   Kafka UI         http://localhost:8081     Jaeger      http://localhost:16686
#   Prometheus       http://localhost:9090

name: tickstream

x-app: &app
  image: tickstream-app:local
  pull_policy: never # built by `make up` from the Dockerfile's "app" stage
  restart: unless-stopped
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    infra-init: { condition: service_completed_successfully }
  environment: &app-env
    KAFKA_BROKERS: kafka:9092
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: eu-west-2
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    OTEL_TRACE_SAMPLE_RATIO: "0.01"
    SYMBOLS: ${SYMBOLS:-BTC-USD,ETH-USD,SOL-USD}

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # KRaft: no ZooKeeper
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ["../scripts/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["/bin/sh", "/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: tickstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xmx256m
    ports: ["8081:8080"]

  localstack:
    image: localstack/localstack:2026.08.5
    environment:
      SERVICES: s3,dynamodb,sqs,sns,lambda,iam,sts,logs
      # Your LocalStack auth token, from .env (LOCALSTACK_AUTH_TOKEN=...).
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      LAMBDA_DOCKER_NETWORK: tickstream_default
    ports: ["4566:4566"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # LocalStack runs the Lambda in a container
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  infra-init: # terraform apply against LocalStack
    build: { context: .., target: infra }
    image: tickstream-infra:local
    depends_on:
      localstack: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes: ["tfstate:/state"]

  ingestor:
    <<: *app
    build: { context: .., target: app }
    entrypoint: ["/app/ingestor"]
  normaliser:
    <<: *app
    entrypoint: ["/app/normaliser"]
  metrics-engine:
    <<: *app
    entrypoint: ["/app/metrics-engine"]
  risk-engine:
    <<: *app
    entrypoint: ["/app/risk-engine"]
  archiver:
    <<: *app
    entrypoint: ["/app/archiver"]
  metrics-sink:
    <<: *app
    entrypoint: ["/app/metrics-sink"]
  alert-bridge:
    <<: *app
    entrypoint: ["/app/alert-bridge"]
  api-gateway:
    <<: *app
    entrypoint: ["/app/api-gateway"]
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: ["./grafana:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

volumes:
  tfstate:
