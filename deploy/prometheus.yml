# Every Go service serves /metrics on port 9100.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: tickstream
    static_configs:
      - targets:
          - ingestor:9100
          - normaliser:9100
          - metrics-engine:9100
          - risk-engine:9100
          - archiver:9100
          - metrics-sink:9100
          - alert-bridge:9100
          - api-gateway:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
